[package]
name = "uterm"
version = "0.1.0"
edition = "2021"
description = "A tiny terminal emulator built on Rio's VT/PTY underpinnings"
license = "MIT"
repository = "https://github.com/lu-zero/uterm"
readme = "README.md"
keywords = ["terminal", "emulator"]
categories = ["command-line-utilities"]

[features]
default = ["x11", "wayland", "bundled-font", "fallback-common", "emoji-fallback"]
# Everything except the emoji data crate (and the opt-in allocator).
lean = ["x11", "wayland", "bundled-font", "fallback-common"]
x11 = ["winit/x11", "softbuffer/x11", "softbuffer/x11-dlopen", "rio-vt/x11"]
wayland = [
    "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita",
    "softbuffer/wayland", "softbuffer/wayland-dlopen", "rio-vt/wayland",
]
bundled-font = ["term-atlas/bundled-font"]
fallback-common = ["term-atlas/fallback-common"]
emoji-fallback = ["term-atlas/emoji-fallback"]
mimalloc = ["dep:mimalloc"]

[dependencies]
rio-vt = { version = "0.5", default-features = false, features = ["pty", "clipboard"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
softbuffer = { version = "0.4", default-features = false }
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
winnow-args = "0.6"
term-atlas = { version = "0.1.5", default-features = false }
mimalloc = { version = "0.1.52", optional = true }
