[package]
name = "uterm"
version = "0.1.0"
edition = "2021"
description = "A tiny terminal emulator built on Rio's VT/PTY underpinnings"
license = "MIT"
repository = "https://github.com/lu-zero/uterm"
readme = "README.md"
keywords = ["terminal", "emulator"]
categories = ["command-line-utilities"]

[features]
default = ["clipboard", "x11", "wayland"]
clipboard = ["rio-vt/clipboard"]
x11 = ["rio-vt/x11"]
wayland = ["rio-vt/wayland"]

[dependencies]
rio-vt = { version = "0.5", default-features = true }
winit = "0.30"
softbuffer = "0.4"
fontique = { version = "0.12", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
winnow-args = "0.6"
term-atlas = "0.1.3"
