# Example configuration for uterm. Copy to ~/.config/uterm/config.toml,
# or pass --config PATH. A missing default file keeps bundled Maple Mono NF.
#
# Search order: --config, $UTERM_CONFIG, $XDG_CONFIG_HOME/uterm/config.toml,
# ~/.config/uterm/config.toml.

# `fonts` is a fallback list: the first face sets the cell size from `M`, and
# each later face adds glyphs the earlier ones lack. Entries are the bundled
# keyword `default`, an installed family name, or a path. `default` follows
# the bundled face if it changes. Paths are absolute, relative to this file,
# or ~/... . A bare name is a family, so a real file named default is written
# as ./default. An empty or missing `fonts` list keeps the bundled face.
# Glyphs none of these cover are looked up in system fonts.
#
# font_size = 14

# fonts = [
#   "default",
#   "Menlo",
#   "/path/to/cjk.ttf",
# ]

# Built-in profiles: ssh = 128x40, sh = 80x25, mc = 80x24. A profile here
# replaces that size when it sets `geometry`, and can override `font_size`.
# Any other name must be defined here; unknown names are errors. --geometry
# wins over both. Omit `fonts` on a profile to inherit the list above;
# `fonts = []` keeps only the bundled face.

# `command` and `args` run a program instead of the login shell; words after
# `--` on the command line override them. `args` needs a `command`.

# [profiles.ssh]
# geometry = "128x40"
# font_size = 13
# fonts = ["default", "/path/to/cjk.ttf"]
# command = "mc"
# args = ["-d"]
